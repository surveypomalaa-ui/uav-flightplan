<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAV Flight Plan</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css">
<style>
  html, body { height:100%; margin:0; font-family:Arial,sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; }
  header { padding:8px 12px; background:#1a3a5c; color:#fff; display:flex;
           align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  #userBox { display:flex; align-items:center; gap:8px; font-size:13px; }
  #nav { display:none; background:#12304d; padding:0 6px; overflow-x:auto; }
  #nav button { background:none; border-radius:0; color:#cfe0f3; padding:10px 12px;
                border-bottom:3px solid transparent; white-space:nowrap; }
  #nav button.active { color:#fff; border-bottom-color:#4285f4; }
  #filterBar { display:none; gap:6px; padding:6px 10px; background:#fff;
               border-bottom:1px solid #ddd; flex-wrap:wrap; align-items:center; font-size:13px; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:16px;
          border:2px solid; background:#fff; color:#222; cursor:pointer; font-size:13px; }
  .chip i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .chip.off { opacity:.45; }
  .chip[data-status="ongoing"] { border-color:#2e9e44; } .chip[data-status="ongoing"] i { background:#2e9e44; }
  .chip[data-status="planned"] { border-color:#ff8c00; } .chip[data-status="planned"] i { background:#ff8c00; }
  .chip[data-status="ended"]   { border-color:#8a8a8a; } .chip[data-status="ended"] i   { background:#8a8a8a; }
  #map { flex:1; min-height:200px; }

  /* bar kecil di bawah peta */
  #mapBar { display:none; align-items:center; justify-content:space-between; gap:8px;
            padding:8px 12px; background:#f4f4f4; border-top:1px solid #ddd; font-size:14px; }
  #app.map-mode #mapBar { display:flex; }

  /* panel untuk tab Drone & Profil */
  #panel { background:#f4f4f4; padding:8px 12px; overflow:auto; font-size:14px; }
  #app.map-mode #panel { display:none; }
  #app:not(.map-mode) #map { display:none; }
  #app:not(.map-mode) #panel { flex:1; }
  .view { display:none; } .view.active { display:block; }

  .form { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .form label { display:flex; flex-direction:column; font-size:12px; color:#444; }
  .form input, .form select { padding:7px; font-size:14px; border:1px solid #bbb; border-radius:6px; background:#fff; }
  .form .full { grid-column:1 / -1; }
  button { padding:8px 14px; border:0; border-radius:6px; background:#4285f4; color:#fff; cursor:pointer; font-size:14px; }
  button:disabled { background:#9bb7ea; cursor:not-allowed; }
  .msg { margin-top:8px; padding:8px; border-radius:6px; display:none; }
  .msg.ok  { display:block; background:#e8ffe8; color:#17652a; }
  .msg.err { display:block; background:#ffe8e8; color:#8a1f1f; }
  .card { background:#fff; border:1px solid #ddd; border-radius:8px; padding:8px 10px; margin-top:6px; }
  .warn { background:#fff3cd; border:1px solid #ffeeba; color:#6b5200; border-radius:6px; padding:8px; margin-top:6px; }
  h3 { margin:6px 0 0; font-size:15px; }

  /* halaman login */
  #landing { display:none; flex:1; flex-direction:column; align-items:center; justify-content:center;
             text-align:center; padding:24px; color:#fff;
             background:linear-gradient(160deg,#12304d,#1a3a5c 60%,#2b5c8a); }
  #landing .logo { font-size:56px; }
  #landing h1 { margin:8px 0 6px; font-size:26px; }
  #landing p { margin:0 0 22px; color:#cfe0f3; max-width:340px; line-height:1.4; }
  #landing .box { background:#fff; color:#222; border-radius:12px; padding:20px 24px;
                  min-width:260px; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  #gbtn { display:flex; justify-content:center; min-height:44px; }
  #loginMsg { margin-top:10px; font-size:13px; color:#555; min-height:16px; }
  #app.login-mode #landing { display:flex; }
  #app.login-mode header, #app.login-mode #nav, #app.login-mode #filterBar,
  #app.login-mode #map, #app.login-mode #panel, #app.login-mode #mapBar { display:none !important; }

  /* popup form rencana terbang */
  .modal-back { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
                align-items:flex-end; justify-content:center; z-index:2000; }
  .modal { background:#fff; width:100%; max-width:480px; border-radius:14px 14px 0 0;
           padding:14px; max-height:90vh; overflow:auto; box-shadow:0 -4px 24px rgba(0,0,0,.3); }
  @media (min-width:600px) {
    .modal-back { align-items:center; }
    .modal { border-radius:14px; }
  }
  .modal-head { display:flex; justify-content:space-between; align-items:center; font-size:16px; }
  .modal-head .x { background:#eee; color:#333; padding:4px 10px; }

  /* notifikasi */
  #toast { position:fixed; left:50%; transform:translateX(-50%); bottom:70px; z-index:3000;
           max-width:90%; padding:10px 14px; border-radius:8px; color:#fff; display:none;
           box-shadow:0 4px 14px rgba(0,0,0,.3); font-size:14px; }
  #toast.ok { background:#2e9e44; } #toast.err { background:#c62828; }

  /* pin lokasi */
  .loc-pin { font-size:30px; line-height:30px; text-align:center; filter:drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
  .leaflet-gl-layer { pointer-events:none; z-index:450; }
</style>
</head>
<body>
<div id="app" class="login-mode">

  <div id="landing">
    <div class="logo">🛩️</div>
    <h1>UAV Flight Plan</h1>
    <p>Sistem pendaftaran rencana terbang drone. Masuk dengan akun Google untuk melanjutkan.</p>
    <div class="box">
      <div id="gbtn"></div>
      <div id="loginMsg"></div>
    </div>
  </div>

  <header>
    <h1>UAV Flight Plan</h1>
    <div id="userBox">
      <span id="userName"></span>
      <button id="btnLogout" style="display:none;padding:4px 10px;background:#5b7a99">Keluar</button>
    </div>
  </header>

  <div id="nav">
    <button data-view="flight">🗺 Peta &amp; Jadwal</button>
    <button data-view="drone">✈ Drone</button>
    <button data-view="profile">👤 Profil Pilot</button>
  </div>

  <div id="filterBar">
    <span>Tampilkan:</span>
    <button class="chip" data-status="ongoing"><i></i>Ongoing <b id="cnt-ongoing">0</b></button>
    <button class="chip" data-status="planned"><i></i>Active plan <b id="cnt-planned">0</b></button>
    <button class="chip off" data-status="ended"><i></i>Ended <b id="cnt-ended">0</b></button>
  </div>

  <div id="map"></div>

  <div id="mapBar">
    <span id="info">Gambar poligon area terbang di peta.</span>
    <button id="btnOpenForm" style="display:none">Isi jadwal</button>
  </div>

  <div id="panel">
    <!-- DRONE -->
    <div class="view" id="view-drone">
      <h3>Drone terdaftar (<span id="d-pt"></span>)</h3>
      <div id="droneList"></div>
      <h3 style="margin-top:14px">Daftarkan drone baru</h3>
      <div class="form">
        <label>Manufaktur <input id="d-manu" maxlength="100" placeholder="mis. DJI"></label>
        <label>Model <input id="d-model" maxlength="100" placeholder="mis. Mavic 3 Enterprise"></label>
        <label>Tahun produksi <input id="d-year" maxlength="4" inputmode="numeric" placeholder="2024"></label>
        <label>Nomor seri <input id="d-sn" maxlength="60"></label>
        <label class="full">Sertifikat / SIDOPI (PDF, maks 5 MB) <input id="d-cert" type="file" accept="application/pdf"></label>
        <button id="btnDrone" class="full">Daftarkan drone</button>
      </div>
      <div class="msg" id="msg-drone"></div>
    </div>

    <!-- PROFIL PILOT -->
    <div class="view" id="view-profile">
      <div id="profileStatus"></div>
      <div class="form">
        <label class="full">Nama lengkap <input id="p-nama" maxlength="100"></label>
        <label class="full">Perusahaan <input id="p-pt" maxlength="150" list="companyList" placeholder="Pilih atau ketik perusahaan"></label>
        <datalist id="companyList"></datalist>
        <label class="full">Sertifikat pilot berlaku sampai <input id="p-valid" type="date"></label>
        <label class="full">Sertifikat pilot (PDF, maks 5 MB) <input id="p-cert" type="file" accept="application/pdf"></label>
        <button id="btnPilot" class="full">Daftar sebagai pilot</button>
      </div>
      <div class="msg" id="msg-profile"></div>
    </div>
  </div>
</div>

<!-- POPUP RENCANA TERBANG -->
<div id="flightModal" class="modal-back">
  <div class="modal">
    <div class="modal-head"><b>Rencana Terbang</b><button id="btnCloseModal" class="x">✕</button></div>
    <div class="card" id="m-info"></div>
    <div id="flightWarn"></div>
    <div class="form">
      <label class="full">Perusahaan <input id="f-pt" readonly></label>
      <label class="full">Drone <select id="f-drone"></select></label>
      <label class="full">Tanggal <input id="f-date" type="date"></label>
      <label>Jam mulai <input id="f-start" type="time"></label>
      <label>Jam selesai <input id="f-end" type="time"></label>
      <button id="btnFlight" class="full" disabled>Kirim rencana terbang</button>
    </div>
    <div class="msg" id="msg-flight"></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js"></script>
<script src="https://unpkg.com/esri-leaflet-vector@4.2.4/dist/esri-leaflet-vector.js"></script>
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogle()"></script>

<script>
const CLIENT_ID = '200371532629-ktdgi0s5n18kcklq46tsb7ler93p7rgu.apps.googleusercontent.com';
const API_URL   = 'https://script.google.com/macros/s/AKfycbzDW89h85pJSqWYkp1nQZhbjsKWkGxtlClf72GsG15R_YxYt9oP4NajVyf5u1CbZ3KE/exec';

/* ====== LAYER DARI ARCGIS ONLINE ======
   Tambah/ubah daftar ini. url = alamat layer, diakhiri nomor layer (/0, /1, ...).
   visible: true = langsung tampil saat peta dibuka.
   Hanya layer yang dibagikan PUBLIK yang bisa dimuat dari sini. */
const ARCGIS_LAYERS = [];

/* ====== FOTO UDARA (kuartalan) ====== */
const ORTHO_BASE = 'https://tiles.arcgis.com/tiles/sd07frZndnauMmJH/arcgis/rest/services/';
const ORTHO_BOUNDS = [[-4.29, 121.61], [-4.15, 121.71]];   // area Pomalaa
  
const COLORS = { ongoing: '#2e9e44', planned: '#ff8c00', ended: '#8a8a8a' };
const LABELS = { ongoing: 'Ongoing', planned: 'Active plan', ended: 'Ended' };

let idToken = sessionStorage.getItem('idToken');
let currentLayer = null;
let polygonRing = null;
const state = { view: 'login', user: null, profile: null, flights: null,
                filters: { ongoing: true, planned: true, ended: false } };

const $ = id => document.getElementById(id);
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showMsg(view, text, ok) {
  const m = $('msg-' + view);
  m.className = 'msg ' + (ok ? 'ok' : 'err');
  m.textContent = text;
}
function clearMsg(view) { const m = $('msg-' + view); m.className = 'msg'; m.textContent = ''; }

let toastTimer;
function toast(text, ok) {
  const t = $('toast');
  t.textContent = text;
  t.className = ok ? 'ok' : 'err';
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, 4500);
}

/* ---------- API ---------- */
async function api(action, data) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action, idToken: idToken }, data || {}))
  });
  const r = await res.json();
  if (!r.ok && /Token tidak valid|Belum login|Token bukan/.test(r.error || '')) {
    logout('Sesi habis, silakan login lagi.');
    throw new Error('Sesi habis');
  }
  return r;
}

function readPdf(inputEl) {
  return new Promise(function (resolve, reject) {
    const f = inputEl.files[0];
    if (!f) return reject(new Error('Pilih file PDF sertifikat dulu'));
    if (f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)) return reject(new Error('File harus PDF'));
    if (f.size > 5 * 1024 * 1024) return reject(new Error('Ukuran file maksimal 5 MB'));
    const rd = new FileReader();
    rd.onload = function () { resolve(String(rd.result).split(',')[1]); };
    rd.onerror = function () { reject(new Error('Gagal membaca file')); };
    rd.readAsDataURL(f);
  });
}

/* ---------- POPUP FORM ---------- */
function openModal() {
  prepareFlightForm();
  clearMsg('flight');
  $('flightModal').style.display = 'flex';
}
function closeModal() { $('flightModal').style.display = 'none'; }
$('btnCloseModal').onclick = closeModal;
$('btnOpenForm').onclick = openModal;
$('flightModal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });

/* ---------- TAMPILAN ---------- */
function setView(v) {
  state.view = v;
  document.querySelectorAll('.view').forEach(function (el) { el.classList.toggle('active', el.id === 'view-' + v); });
  document.querySelectorAll('#nav button').forEach(function (b) { b.classList.toggle('active', b.dataset.view === v); });
  const mapMode = (v === 'flight');
  $('app').classList.toggle('map-mode', mapMode);
  $('app').classList.toggle('login-mode', v === 'login');
  $('filterBar').style.display = mapMode ? 'flex' : 'none';
  if (!mapMode) closeModal();
  if (mapMode) setTimeout(function () { map.invalidateSize(); addVectorLayersOnce(); zoomToIupk(false); }, 120);
  if (v === 'drone') renderDrones();
  if (v === 'profile') { renderProfile(); loadCompanies(); }
  if (v === 'flight') { prepareFlightForm(); loadFlights(); }
}
document.querySelectorAll('#nav button').forEach(function (b) {
  b.onclick = function () {
    if (!state.profile || !state.profile.registered) { return setView('profile'); }
    setView(b.dataset.view);
  };
});

/* ---------- LOGIN ---------- */
function initGoogle() {
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onLogin });
  google.accounts.id.renderButton($('gbtn'), { theme: 'filled_blue', size: 'large', text: 'signin_with' });
  if (idToken) { $('loginMsg').textContent = 'Memeriksa sesi...'; checkUser(); }
}
function onLogin(resp) {
  idToken = resp.credential;
  sessionStorage.setItem('idToken', idToken);
  checkUser();
}
function logout(message) {
  idToken = null;
  sessionStorage.removeItem('idToken');
  state.user = null; state.profile = null; state.flights = null;
  didInitialZoom = false;
  flightsLayer.clearLayers();
  if (currentLayer) { map.removeLayer(currentLayer); currentLayer = null; polygonRing = null; }
  $('btnOpenForm').style.display = 'none';
  $('userName').textContent = '';
  $('btnLogout').style.display = 'none';
  $('nav').style.display = 'none';
  setView('login');
  $('loginMsg').textContent = message || '';
}
$('btnLogout').onclick = function () { logout(); };

async function checkUser() {
  try {
    const r = await api('me');
    if (!r.ok) throw new Error(r.error);
    state.user = r.user; state.profile = r.profile;
    $('userName').textContent = 'Halo, ' + r.user.name;
    $('btnLogout').style.display = '';
    $('nav').style.display = 'flex';
    $('loginMsg').textContent = '';
    $('f-date').min = new Date().toLocaleDateString('sv-SE');
    if (!r.profile.registered) {
      setView('profile');
      showMsg('profile', 'Anda belum terdaftar. Lengkapi data pilot di bawah untuk mulai mengirim rencana terbang.', false);
    } else {
      setView('flight');
    }
  } catch (err) {
    if (err.message !== 'Sesi habis') logout('Login gagal: ' + err.message);
  }
}

/* ---------- PETA ---------- */
const map = L.map('map').setView([-2.5, 118], 5);
const satelit = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 19, attribution: 'Tiles &copy; Esri' }).addTo(map);
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
const topo = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 19, attribution: 'Tiles &copy; Esri' });

/* ---------- LOKASI SAYA (dengan pin) ---------- */
let locMarker = null, locCircle = null;
const locBtn = L.control({ position: 'topright' });
locBtn.onAdd = function () {
  const b = L.DomUtil.create('button');
  b.id = 'btnLoc';
  b.textContent = '📍 Lokasi saya';
  L.DomEvent.disableClickPropagation(b);
  b.onclick = function () {
    b.disabled = true; b.textContent = 'Mencari lokasi...';
    map.locate({ setView: true, maxZoom: 17, enableHighAccuracy: true, timeout: 15000 });
  };
  return b;
};
locBtn.addTo(map);

function resetLocBtn() { const b = $('btnLoc'); if (b) { b.disabled = false; b.textContent = '📍 Lokasi saya'; } }

map.on('locationfound', function (e) {
  if (locMarker) map.removeLayer(locMarker);
  if (locCircle) map.removeLayer(locCircle);
  locCircle = L.circle(e.latlng, { radius: e.accuracy, color: '#4285f4', weight: 1,
                                   fillOpacity: 0.12, pmIgnore: true, interactive: false }).addTo(map);
  locMarker = L.marker(e.latlng, {
    pmIgnore: true,
    icon: L.divIcon({ className: 'loc-pin', html: '📍', iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28] })
  }).addTo(map).bindPopup('<b>Lokasi Anda</b><br>Akurasi ±' + Math.round(e.accuracy) + ' m').openPopup();
  resetLocBtn();
});
map.on('locationerror', function (e) {
  resetLocBtn();
  toast('Lokasi tidak bisa diambil. Pastikan izin lokasi diaktifkan di browser. (' + e.message + ')', false);
});

/* ---------- LAYER ARCGIS ---------- */
function popupFromProps(title, p) {
  const keys = Object.keys(p || {}).filter(function (k) { return !/^(OBJECTID|GlobalID|Shape|FID)/i.test(k); }).slice(0, 8);
  return '<b>' + esc(title) + '</b>' + keys.map(function (k) { return '<br>' + esc(k) + ': ' + esc(p[k]); }).join('');
}

const overlays = {};
if (window.L && L.esri) {
  ARCGIS_LAYERS.forEach(function (cfg) {
    const color = cfg.color || '#3388ff';
    const lyr = L.esri.featureLayer({
      url: cfg.url,
      pmIgnore: true,
      style: function () { return { color: color, weight: 2, fillOpacity: 0.2 }; },
      pointToLayer: function (geo, latlng) {
        return L.circleMarker(latlng, { radius: 5, color: color, fillOpacity: 0.8, pmIgnore: true });
      }
    });
    lyr.bindPopup(function (layer) { return popupFromProps(cfg.name, layer.feature.properties); });
    lyr.on('requesterror', function () { console.warn('Layer ArcGIS gagal dimuat:', cfg.name); });
    overlays[cfg.name] = lyr;
    if (cfg.visible) lyr.addTo(map);
  });
}

/* ---------- PENERBANGAN + FILTER STATUS ---------- */
const flightsLayer = L.geoJSON(null, {
  pmIgnore: true,
  style: function (f) {
    const p = f.properties;
    return { color: COLORS[p.status] || '#888', weight: p.mine ? 4 : 2,
             fillOpacity: p.status === 'ended' ? 0.1 : 0.25 };
  },
  onEachFeature: function (f, layer) {
    const p = f.properties;
    layer.bindPopup('<b>' + esc(p.nama) + '</b>' + (p.mine ? ' (Anda)' : '') +
      '<br>' + esc(p.pt) + '<br>' + esc(p.dr_details) +
      '<br>' + esc(p.flight_date) + ' ' + esc(p.t_start) + '–' + esc(p.t_end) +
      '<br><b style="color:' + (COLORS[p.status] || '#888') + '">' + esc(LABELS[p.status] || p.status) + '</b>');
  }
}).addTo(map);
overlays['Area terbang (rencana)'] = flightsLayer;

const layersCtl = L.control.layers({ 'Satelit': satelit, 'Peta jalan': osm, 'Topografi': topo }, overlays).addTo(map);

function orthoCandidates() {                       // dari kuartal depan, mundur 10 kuartal
  const d = new Date();
  let y = d.getFullYear(), q = Math.floor(d.getMonth() / 3) + 1;
  q += 1; if (q > 4) { q = 1; y++; }
  const out = [];
  for (let i = 0; i < 10; i++) {
    out.push({ name: 'Q' + q + '_' + y, label: 'Q' + q + ' ' + y });
    q--; if (q < 1) { q = 4; y--; }
  }
  return out;
}

function probeTile(name) {                         // cek satu tile contoh (zoom 13, area Pomalaa)
  return new Promise(function (resolve) {
    const img = new Image();
    const t = setTimeout(function () { resolve(false); }, 8000);
    img.onload  = function () { clearTimeout(t); resolve(true); };
    img.onerror = function () { clearTimeout(t); resolve(false); };
    img.src = ORTHO_BASE + name + '/MapServer/tile/13/4191/6864';
  });
}

async function loadOrtho() {
  const cands = orthoCandidates();
  const ok = await Promise.all(cands.map(function (c) { return probeTile(c.name); }));
  const found = cands.filter(function (c, i) { return ok[i]; });     // urut: terbaru → lama
  found.forEach(function (c, i) {
    const lyr = L.tileLayer(ORTHO_BASE + c.name + '/MapServer/tile/{z}/{y}/{x}', {
      minZoom: 11, maxZoom: 19, minNativeZoom: 13, maxNativeZoom: 17,
      bounds: ORTHO_BOUNDS, attribution: 'Foto udara ' + c.label,
      zIndex: 10 + (found.length - i)
    });
    layersCtl.addOverlay(lyr, 'Foto Udara ' + c.label + (i === 0 ? ' (terbaru)' : ''));
    if (i === 0) lyr.addTo(map);                                      // hanya yang terbaru aktif
  });
  if (!found.length) console.warn('Foto udara tidak ditemukan');
}
loadOrtho();
/* ====== LAYER VECTOR TILE: IUPK (aktif) & POM SHEET (mati) ====== */
const VT = {
  iupk: 'https://vectortileservices.arcgis.com/sd07frZndnauMmJH/arcgis/rest/services/IUPK_VALE/VectorTileServer',
  pom:  'https://vectortileservices.arcgis.com/sd07frZndnauMmJH/arcgis/rest/services/POM_SHEET/VectorTileServer'
};
let iupkLayer = null, pomLayer = null;
let iupkBounds = null, didInitialZoom = false, vtAdded = false;

if (window.L && L.esri && L.esri.Vector) {
  try {
    iupkLayer = L.esri.Vector.vectorTileLayer(VT.iupk);
    pomLayer  = L.esri.Vector.vectorTileLayer(VT.pom);
    layersCtl.addOverlay(iupkLayer, 'IUPK Vale');
    layersCtl.addOverlay(pomLayer, 'POM Sheet');
  } catch (e) { console.warn('Layer vector tile gagal dibuat:', e); }
} else {
  console.warn('Library vector tile tidak termuat (L.esri.Vector tidak ada)');
}

// dipasang saat peta pertama kali terlihat (peta tersembunyi di halaman login)
function addVectorLayersOnce() {
  if (vtAdded || !iupkLayer) return;
  vtAdded = true;
  iupkLayer.addTo(map);            // IUPK langsung aktif; POM Sheet dinyalakan lewat kontrol layer
}

function mercToLatLng(x, y) { return L.Projection.SphericalMercator.unproject(L.point(x, y)); }

async function loadIupkExtent() {
  try {
    const r = await fetch(VT.iupk + '?f=json');
    const j = await r.json();
    const e = j.fullExtent || j.initialExtent;
    if (!e) return;
    const wkid = (e.spatialReference && (e.spatialReference.latestWkid || e.spatialReference.wkid)) || 102100;
    let sw, ne;
    if (wkid === 4326) { sw = L.latLng(e.ymin, e.xmin); ne = L.latLng(e.ymax, e.xmax); }
    else { sw = mercToLatLng(e.xmin, e.ymin); ne = mercToLatLng(e.xmax, e.ymax); }
    if ((ne.lng - sw.lng) > 60) return;           // extent seluruh dunia → abaikan
    iupkBounds = L.latLngBounds(sw, ne);
    zoomToIupk(false);
  } catch (err) { console.warn('Extent IUPK gagal dibaca:', err); }
}

function zoomToIupk(force) {
  if (!iupkBounds) return;
  if (state.view !== 'flight' || !$('map').offsetHeight) return;   // peta belum terlihat
  if (didInitialZoom && !force) return;
  didInitialZoom = true;
  map.fitBounds(iupkBounds, { padding: [20, 20] });
}
loadIupkExtent();

const iupkBtn = L.control({ position: 'topright' });
iupkBtn.onAdd = function () {
  const b = L.DomUtil.create('button');
  b.textContent = '🎯 Area IUPK';
  L.DomEvent.disableClickPropagation(b);
  b.onclick = function () {
    if (iupkBounds) zoomToIupk(true); else toast('Area IUPK belum terbaca', false);
  };
  return b;
};
iupkBtn.addTo(map);
  
async function loadFlights() {
  try {
    const r = await api('listFlights');
    if (!r.ok) throw new Error(r.error);
    state.flights = r.geojson;
    renderFlights();
  } catch (err) {
    if (err.message !== 'Sesi habis') toast('Gagal memuat area terbang: ' + err.message, false);
  }
}

function renderFlights() {
  const all = (state.flights && state.flights.features) || [];
  const counts = { ongoing: 0, planned: 0, ended: 0 };
  all.forEach(function (f) { if (counts[f.properties.status] !== undefined) counts[f.properties.status]++; });
  Object.keys(counts).forEach(function (k) { $('cnt-' + k).textContent = counts[k]; });

  flightsLayer.clearLayers();
  flightsLayer.addData({
    type: 'FeatureCollection',
    features: all.filter(function (f) { return state.filters[f.properties.status]; })
  });
}

document.querySelectorAll('.chip').forEach(function (c) {
  c.onclick = function () {
    const s = c.dataset.status;
    state.filters[s] = !state.filters[s];
    c.classList.toggle('off', !state.filters[s]);
    renderFlights();
  };
});
setInterval(function () { if (idToken && state.view === 'flight') loadFlights(); }, 60000);

/* ---------- GAMBAR POLIGON ---------- */
map.pm.addControls({
  position: 'topleft',
  drawMarker: false, drawCircleMarker: false, drawPolyline: false,
  drawCircle: false, drawText: false, cutPolygon: false, rotateMode: false,
  drawRectangle: true, drawPolygon: true,
  editMode: true, dragMode: true, removalMode: true
});

function areaHa(ring) {                       // perkiraan luas (hektar)
  const lat0 = ring.reduce(function (s, c) { return s + c[1]; }, 0) / ring.length;
  const kx = 111320 * Math.cos(lat0 * Math.PI / 180), ky = 110540;
  let s = 0;
  for (let i = 0; i < ring.length - 1; i++) {
    s += (ring[i][0] * kx) * (ring[i + 1][1] * ky) - (ring[i + 1][0] * kx) * (ring[i][1] * ky);
  }
  return Math.abs(s) / 2 / 10000;
}

function updatePolygon() {
  if (!currentLayer) {
    polygonRing = null;
    $('info').textContent = 'Gambar poligon area terbang di peta.';
    $('btnOpenForm').style.display = 'none';
    $('m-info').textContent = '';
  } else {
    polygonRing = currentLayer.toGeoJSON().geometry.coordinates[0];
    const txt = (polygonRing.length - 1) + ' titik sudut, luas ± ' + areaHa(polygonRing).toFixed(1) + ' ha';
    $('info').textContent = 'Area terbang siap: ' + txt;
    $('m-info').textContent = 'Area terbang: ' + txt;
    $('btnOpenForm').style.display = '';
  }
  refreshFlightButton();
}
map.on('pm:create', function (e) {
  if (currentLayer) map.removeLayer(currentLayer);
  currentLayer = e.layer;
  currentLayer.on('pm:edit', updatePolygon);
  currentLayer.on('pm:dragend', updatePolygon);
  currentLayer.on('pm:remove', function () { currentLayer = null; updatePolygon(); closeModal(); });
  updatePolygon();
  openModal();                                  // popup muncul setelah poligon selesai
});

/* ---------- FORM RENCANA TERBANG ---------- */
function flightBlockedReason() {
  const p = state.profile;
  if (!p || !p.registered) return 'Anda belum terdaftar sebagai pilot (tab Profil Pilot).';
  if (p.expired) return 'Sertifikat pilot sudah kedaluwarsa. Perbarui di tab Profil Pilot.';
  if (!p.drones || !p.drones.length) return 'Perusahaan Anda belum punya drone terdaftar. Daftarkan di tab Drone.';
  return '';
}
function refreshFlightButton() {
  $('btnFlight').disabled = !(polygonRing && !flightBlockedReason());
}
function prepareFlightForm() {
  const p = state.profile;
  const reason = flightBlockedReason();
  $('flightWarn').innerHTML = reason ? '<div class="warn">' + esc(reason) + '</div>' : '';
  $('f-pt').value = (p && p.pt) || '';
  if (!$('f-date').value) $('f-date').value = new Date().toLocaleDateString('sv-SE');
  const sel = $('f-drone');
  const keep = sel.value;
  sel.innerHTML = '';
  ((p && p.drones) || []).forEach(function (d) {
    const o = document.createElement('option');
    o.value = d.drone_id; o.textContent = d.label;
    sel.appendChild(o);
  });
  if (keep) sel.value = keep;
  refreshFlightButton();
}

$('btnFlight').onclick = async function () {
  const btn = $('btnFlight');
  clearMsg('flight');
  const data = {
    drone_id: $('f-drone').value, flight_date: $('f-date').value,
    t_start: $('f-start').value, t_end: $('f-end').value, polygon: polygonRing
  };
  if (!data.drone_id || !data.flight_date || !data.t_start || !data.t_end) {
    return showMsg('flight', 'Lengkapi semua kolom dulu.', false);
  }
  btn.disabled = true; btn.textContent = 'Mengirim...';
  try {
    const r = await api('submitFlight', data);
    if (r.ok) {
      closeModal();
      if (currentLayer) { map.removeLayer(currentLayer); currentLayer = null; }
      updatePolygon();
      toast('✔ Rencana terbang tersimpan.', true);
      loadFlights();
    } else if (r.conflict) {
      showMsg('flight', '✖ ' + r.error + ' ' + r.conflicts.join('; '), false);
    } else {
      showMsg('flight', '✖ ' + r.error, false);
    }
  } catch (err) {
    if (err.message !== 'Sesi habis') showMsg('flight', '✖ Gagal terhubung: ' + err.message, false);
  } finally {
    btn.textContent = 'Kirim rencana terbang';
    refreshFlightButton();
  }
};

/* ---------- DRONE ---------- */
function renderDrones() {
  const p = state.profile;
  $('d-pt').textContent = (p && p.pt) || '';
  const list = (p && p.drones) || [];
  $('droneList').innerHTML = list.length
    ? list.map(function (d) { return '<div class="card">' + esc(d.label) + ' <small>(' + esc(d.year_mn) + ')</small></div>'; }).join('')
    : '<div class="card">Belum ada drone terdaftar.</div>';
}

$('btnDrone').onclick = async function () {
  const btn = $('btnDrone');
  clearMsg('drone');
  btn.disabled = true; btn.textContent = 'Mengirim...';
  try {
    const cert = await readPdf($('d-cert'));
    const r = await api('registerUAV', {
      manufacture: $('d-manu').value, dr_details: $('d-model').value,
      year_mn: $('d-year').value, drone_sn: $('d-sn').value, cert_base64: cert
    });
    if (!r.ok) throw new Error(r.error);
    state.profile = r.profile;
    ['d-manu', 'd-model', 'd-year', 'd-sn', 'd-cert'].forEach(function (id) { $(id).value = ''; });
    renderDrones();
    showMsg('drone', '✔ Drone berhasil didaftarkan.', true);
  } catch (err) {
    if (err.message !== 'Sesi habis') showMsg('drone', '✖ ' + err.message, false);
  } finally {
    btn.disabled = false; btn.textContent = 'Daftarkan drone';
  }
};

/* ---------- PROFIL PILOT ---------- */
async function loadCompanies() {
  try {
    const r = await api('companies');
    if (r.ok) $('companyList').innerHTML = r.companies.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
  } catch (e) { /* daftar saran saja, boleh gagal */ }
}

function renderProfile() {
  const p = state.profile;
  if (p && p.registered) {
    $('profileStatus').innerHTML = '<div class="card">Terdaftar sebagai <b>' + esc(p.nama) + '</b> (' + esc(p.pt) +
      ')<br>Sertifikat berlaku sampai: <b>' + esc(p.valid_until) + '</b>' +
      (p.expired ? ' <span style="color:#b00020">— KEDALUWARSA</span>' : '') +
      '<br><small>Untuk memperbarui, isi ulang formulir di bawah dengan sertifikat terbaru.</small></div>';
    $('p-nama').value = p.nama; $('p-pt').value = p.pt;
    $('btnPilot').textContent = 'Perbarui data pilot';
  } else {
    $('profileStatus').innerHTML = '';
    if (!$('p-nama').value && state.user) $('p-nama').value = state.user.name;
    $('btnPilot').textContent = 'Daftar sebagai pilot';
  }
}

$('btnPilot').onclick = async function () {
  const btn = $('btnPilot');
  const label = btn.textContent;
  clearMsg('profile');
  btn.disabled = true; btn.textContent = 'Mengirim...';
  try {
    const cert = await readPdf($('p-cert'));
    const r = await api('registerPilot', {
      nama: $('p-nama').value, pt: $('p-pt').value,
      valid_until: $('p-valid').value, cert_base64: cert
    });
    if (!r.ok) throw new Error(r.error);
    state.profile = r.profile;
    $('p-cert').value = '';
    renderProfile();
    showMsg('profile', '✔ Data pilot tersimpan.', true);
  } catch (err) {
    if (err.message !== 'Sesi habis') showMsg('profile', '✖ ' + err.message, false);
  } finally {
    btn.disabled = false;
    btn.textContent = (state.profile && state.profile.registered) ? 'Perbarui data pilot' : label;
  }
};
</script>
